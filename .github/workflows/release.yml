name: Publish NBPost 0.1.37
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: [.github/workflows/release.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
    group: release-0.1.37
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.1.37
      - name: Verify and package
        shell: bash
        run: |
          printf '%s  NBPost.exe\n' 'ce9c402b084e72a2d1932a6c44dcac9d0e572581bb71e9a7864a16ca00788dce' > SHA256.txt
          sha256sum --check SHA256.txt
          zip NBPost-0.1.37-Windows-portable.zip NBPost.exe 使用说明.md SHA256.txt
          sha256sum NBPost-0.1.36-Windows-portable.zip >> SHA256.txt
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view v0.1.37 >/dev/null 2>&1; then
            gh release create v0.1.37 --verify-tag --title 'NBPost 0.1.37' --notes 'Windows 便携版，包含剪藏来源单点展示、剪藏时间本地化和可靠性优化，已完成回归测试与人工验收。本仓库仅提供程序、使用说明与校验值；产品源码不公开。'
          fi
          gh release upload v0.1.37 NBPost-0.1.37-Windows-portable.zip NBPost.exe 使用说明.md SHA256.txt --clobber
